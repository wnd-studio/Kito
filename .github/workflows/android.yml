name: Kito Android

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: mobile/android/**/*.gradle*
      - name: Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install and test mobile
        working-directory: mobile
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync android
      - name: Assemble native Android
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Verify installable APK
        run: |
          set -euo pipefail
          mkdir -p output
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk output/Kito-Android-v1.0.0-preview.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose output/Kito-Android-v1.0.0-preview.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging output/Kito-Android-v1.0.0-preview.apk | head -n 6
      - uses: actions/upload-artifact@v4
        with:
          name: Kito-Android-v1.0.0-preview
          path: output/Kito-Android-v1.0.0-preview.apk
          if-no-files-found: error
          retention-days: 14

  android-emulator:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enable KVM for Android emulator
        run: sudo chmod 666 /dev/kvm
      - uses: actions/download-artifact@v4
        with:
          name: Kito-Android-v1.0.0-preview
          path: output
      - name: Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            trap 'adb logcat -d -v time > output/Kito-Android-logcat.txt || true' EXIT
            adb logcat -c
            adb install -r output/Kito-Android-v1.0.0-preview.apk
            adb shell am start -n br.net.wnd.kito/.MainActivity
            sleep 25
            adb shell pidof br.net.wnd.kito
            adb exec-out screencap -p > output/Kito-Android-emulator-home.png
            adb shell input tap 330 2140
            sleep 5
            adb exec-out screencap -p > output/Kito-Android-emulator-tasks.png
            adb shell pidof br.net.wnd.kito
            test -s output/Kito-Android-emulator-home.png
            test -s output/Kito-Android-emulator-tasks.png
            # Android's UIAutomator tree reports the WebView node but omits its HTML text.
            # Verify the navigation gesture changed the rendered screen instead.
            if [ "$(sha256sum output/Kito-Android-emulator-home.png | cut -d' ' -f1)" = "$(sha256sum output/Kito-Android-emulator-tasks.png | cut -d' ' -f1)" ]; then
              echo 'Navigation did not change the emulator screenshot' >&2
              exit 1
            fi
            timeout 40s adb shell uiautomator dump /sdcard/kito-ui.xml
            adb shell cat /sdcard/kito-ui.xml > output/Kito-Android-ui.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kito-Android-emulator-evidence
          path: |
            output/Kito-Android-emulator-*.png
            output/Kito-Android-ui.xml
            output/Kito-Android-logcat.txt
          if-no-files-found: warn
          retention-days: 14
